name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Compilar
        run: |
          ZIP=$(for f in *.zip; do echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -n | tail -1 | cut -d' ' -f2-)
          echo "Usando: $ZIP"
          unzip -q "$ZIP" -d projeto
          ROOT=$(dirname "$(find projeto -name settings.gradle.kts | head -1)")
          cd "$ROOT"
          gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: CRT-Overlay-Android-APK
          path: projeto/**/build/outputs/apk/debug/*.apk
